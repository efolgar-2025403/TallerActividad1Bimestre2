<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html}">
<head>
    <title th:text="${titulo}">Catálogo de Productos</title>
    <style>
        .producto-card {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            transition: all 0.3s ease;
            height: 100%;
        }
        .producto-card:hover {
            border-color: #D4AF37;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
            transform: translateY(-3px);
        }
        .producto-precio {
            color: #D4AF37;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .producto-stock {
            color: #888888;
            font-size: 0.9rem;
        }
        .stock-bajo {
            color: #dc3545 !important;
        }
        .stock-medio {
            color: #ffc107 !important;
        }
        .carrito-badge {
            background: #D4AF37;
            color: #000000;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 5px;
        }
    </style>
</head>
<body>
<th:block th:fragment="content">
    <div class="row">
        <div class="col-12">

            <!-- Header con bienvenida y carrito -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="color: #D4AF37;">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${clienteNombre}">Cliente</span>
                    </h4>
                </div>
                <div>
                    <a th:href="@{/tienda/carrito}" class="btn btn-outline-warning position-relative">
                        <i class="bi bi-cart3"></i> Ver Carrito
                        <span class="carrito-badge" th:text="${cantidadItems}">0</span>
                    </a>
                    <a th:href="@{/tienda/logout}" class="btn btn-outline-danger ms-2">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </a>
                </div>
            </div>

            <!-- Grid de productos -->
            <div class="row g-4">
                <div th:each="producto : ${productos}" class="col-md-4 col-lg-3">
                    <div class="producto-card p-4">
                        <div class="text-center mb-3">
                            <i class="bi bi-box-seam" style="font-size: 3rem; color: #D4AF37;"></i>
                        </div>
                        <h5 class="text-center" style="color: #e0e0e0;" th:text="${producto.nombreProducto}">Producto</h5>
                        <p class="text-center text-muted small" th:text="${producto.descripcion}">Descripción</p>

                        <div class="text-center mb-3">
                            <span class="producto-precio" th:text="'Q ' + ${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}">Q 0.00</span>
                        </div>

                        <div class="text-center mb-3">
                                <span class="producto-stock"
                                      th:classappend="${producto.stock <= 5} ? 'stock-bajo' : (${producto.stock <= 15} ? 'stock-medio' : '')"
                                      th:text="'Stock: ' + ${producto.stock} + ' disponibles'">Stock: 0</span>
                        </div>

                        <form th:action="@{/tienda/agregar}" method="post" class="mt-3">
                            <input type="hidden" name="codigoProducto" th:value="${producto.codigoProducto}">
                            <div class="input-group">
                                <input type="number" name="cantidad" value="1" min="1"
                                       th:max="${producto.stock}" class="form-control text-center"
                                       style="background: #1a1a1a; border: 1px solid #333333; color: #e0e0e0;">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-cart-plus"></i> Agregar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Mensaje si no hay productos -->
            <div th:if="${productos == null || productos.isEmpty()}" class="text-center mt-5">
                <i class="bi bi-shop" style="font-size: 4rem; color: #666666;"></i>
                <h4 class="mt-3" style="color: #888888;">No hay productos disponibles</h4>
                <p style="color: #666666;">No se encontraron productos con stock disponible.</p>
            </div>

        </div>
    </div>
</th:block>
</body>
</html>
