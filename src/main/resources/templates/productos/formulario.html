<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html}">
<head>
    <title th:text="${titulo}">Formulario Producto</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0" th:text="${titulo}"></h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/web/productos/guardar}" th:object="${producto}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Código *</label>
                                <input type="number" class="form-control"
                                       th:field="*{codigoProducto}"
                                       th:readonly="${producto.codigoProducto != null}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Estado</label>
                                <select class="form-select" th:field="*{estado}">
                                    <option value="1">Activo</option>
                                    <option value="0">Inactivo</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre *</label>
                                <input type="text" class="form-control"
                                       th:field="*{nombreProducto}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Precio *</label>
                                <input type="number" step="0.01" class="form-control"
                                       th:field="*{precio}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock *</label>
                                <input type="number" class="form-control"
                                       th:field="*{stock}" required>
                            </div>

                            <div class="col-12 mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control"
                                          th:field="*{descripcion}" rows="3"></textarea>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                            <a th:href="@{/web/productos}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
