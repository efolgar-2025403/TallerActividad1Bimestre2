<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html}">
<head>
    <title th:text="${titulo}">Iniciar Sesión</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header text-center">
                    <i class="bi bi-shield-lock" style="color: #D4AF37; font-size: 3rem;"></i>
                    <h4 class="mt-2">Iniciar Sesión</h4>
                    <p style="color: #888888;">
                        <i class="bi bi-info-circle"></i>
                        Ingrese sus credenciales para acceder
                    </p>
                </div>
                <div class="card-body">
                    <form th:action="@{/tienda/login}" method="post">
                        <div class="mb-4">
                            <label class="form-label">
                                <i class="bi bi-person"></i> Usuario
                            </label>
                            <input type="text" name="username" class="form-control form-control-lg"
                                   placeholder="Ingrese su usuario" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">
                                <i class="bi bi-key"></i> Contraseña
                            </label>
                            <input type="password" name="password" class="form-control form-control-lg"
                                   placeholder="Ingrese su contraseña" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right"></i> Ingresar
                            </button>
                        </div>
                    </form>

                    <!-- Información de usuarios de prueba -->
                    <div class="mt-4">
                        <div class="card" style="background: #1a1a1a; border: 1px solid #333333;">
                            <div class="card-header" style="border-bottom: 1px solid #333333;">
                                <i class="bi bi-people"></i> Usuarios de Prueba
                            </div>
                            <div class="card-body p-0">
                                <table class="table table-sm mb-0" style="color: #cccccc;">
                                    <thead>
                                    <tr>
                                        <th>Usuario</th>
                                        <th>Contraseña</th>
                                        <th>Rol</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr>
                                        <td>admin</td>
                                        <td>admin123</td>
                                        <td><span class="badge bg-primary">ADMIN</span></td>
                                    </tr>
                                    <tr>
                                        <td>usuario</td>
                                        <td>usuario123</td>
                                        <td><span class="badge bg-secondary">USER</span></td>
                                    </tr>
                                    <tr>
                                        <td>ever</td>
                                        <td>ever123</td>
                                        <td>
                                            <span class="badge bg-primary">ADMIN</span>
                                            <span class="badge bg-secondary">USER</span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 text-center">
                        <a th:href="@{/tienda/catalogo}" class="btn btn-outline-warning">
                            <i class="bi bi-shop"></i> Ir al Catálogo
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
