<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html}">
<head>
    <title th:text="${titulo}">Usuarios</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="mb-3">
        <a th:href="@{/web/usuarios/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Nuevo Usuario
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table id="dataTable" class="table table-hover">
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.codigoUsuario}"></td>
                        <td th:text="${usuario.username}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td>
                                    <span class="badge"
                                          th:classappend="${usuario.rol == 'admin'} ? 'bg-primary' : 'bg-secondary'"
                                          th:text="${usuario.rol}"></span>
                        </td>
                        <td>
                                    <span class="badge"
                                          th:classappend="${usuario.estado == 1} ? 'bg-success' : 'bg-danger'"
                                          th:text="${usuario.estado == 1} ? 'Activo' : 'Inactivo'"></span>
                        </td>
                        <td>
                            <a th:href="@{/web/usuarios/editar/{id}(id=${usuario.codigoUsuario})}"
                               class="btn btn-sm btn-warning me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/web/usuarios/eliminar/{id}(id=${usuario.codigoUsuario})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('¿Eliminar este usuario?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
