<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html}">
<head>
    <title th:text="${titulo}">Acceso Denegado</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card">
                <div class="card-body py-5">
                    <i class="bi bi-lock-fill" style="font-size: 5rem; color: #dc3545;"></i>
                    <h1 class="display-1 mt-3" style="color: #dc3545;">403</h1>
                    <h3 style="color: #dc3545;">Acceso Denegado</h3>
                    <p style="color: #cccccc;" th:text="${mensaje}">
                        No tienes permisos para acceder a esta página
                    </p>
                    <div class="mt-4">
                        <a th:href="@{/tienda/catalogo}" class="btn btn-primary">
                            <i class="bi bi-house"></i> Ir al Catálogo
                        </a>
                        <a th:href="@{/logout}" class="btn btn-outline-danger ms-2">
                            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
